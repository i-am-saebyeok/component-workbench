name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm ci의 prepare가 dist를 빌드한다.
      - run: npm ci
      - run: npm run typecheck
      # pretest가 다시 빌드한다. npm pack tarball을 임시 서비스에 설치하는 검사를 포함한다. 브라우저 QA(npm run qa:browser)는 로컬 Chromium이 필요해 CI에서 돌리지 않는다.
      - run: npm test
      - run: npm run openspec:validate
